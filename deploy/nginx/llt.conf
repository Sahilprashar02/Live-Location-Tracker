# ═══════════════════════════════════════════════════════════════════════════════
# Live Location Tracker API — Nginx Virtual Host (backend only)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Domain:  llt.140-245-27-200.sslip.io
# Upstream: llt-backend:5000 (via platform-network; container publishes no host port)
#
# The frontend is hosted separately (Vercel) and is NOT served by this vhost.
# Adapted from teambaithak.conf because the app uses Socket.IO:
#   + Upgrade/Connection headers for /socket.io/ (polling → websocket upgrade,
#     pingTimeout 30s / pingInterval 10s in backend/src/server.js).
#   + Long proxy read/send timeouts for the long-lived socket connections.
#   + /health passthrough for the container healthcheck.
#
# To install (on the server):
#   1. certbot certonly --webroot -w /var/www/certbot -d llt.140-245-27-200.sslip.io
#   2. copy this file to /opt/apps/infra/nginx/conf.d/llt.conf
#   3. docker exec global-nginx nginx -t && docker exec global-nginx nginx -s reload
# ═══════════════════════════════════════════════════════════════════════════════

# ─── Upstream pool ─────────────────────────────────────────────────────────────
# Single persistent Node process (Socket.IO keeps in-memory state, so this app
# must not be scaled across processes/containers without a Redis adapter +
# sticky sessions). `keepalive 64` reuses backend TCP connections and requires
# proxy_http_version 1.1 + cleared Connection header in each location below.
upstream llt_backend {
    server llt-backend:5000;
    keepalive 64;
}

# ─── HTTP (Port 80) — ACME Challenge + HTTPS Redirect ────────────────────────
server {
    listen 80;
    server_name llt.140-245-27-200.sslip.io;

    # Certbot ACME challenge (webroot shared volume)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS (Port 443) ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name llt.140-245-27-200.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/llt.140-245-27-200.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llt.140-245-27-200.sslip.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Location payloads are tiny JSON; 10M is generous headroom.
    client_max_body_size 10M;

    # ── Socket.IO (polling + websocket upgrade, long-lived) ──────
    location /socket.io/ {
        proxy_pass http://llt_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        # Never buffer/cache the realtime stream
        proxy_buffering off;
        proxy_cache off;

        # Must exceed Socket.IO pingTimeout (30s) and allow long sessions.
        proxy_connect_timeout 30s;
        proxy_send_timeout    86400s;
        proxy_read_timeout    86400s;
    }

    # ── Health check (compose healthcheck / UptimeRobot) ──────────
    location = /health {
        proxy_pass http://llt_backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ── All other API / OAuth routes ──────────────────────────────
    location / {
        proxy_pass http://llt_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        limit_req zone=general burst=50 nodelay;
    }
}

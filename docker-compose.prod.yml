# ═══════════════════════════════════════════════════════════════════════════════
# Live Location Tracker — Production Docker Compose (backend only)
# ═══════════════════════════════════════════════════════════════════════════════
#
# This compose file manages ONLY the application backend container.
# Global infrastructure (nginx, mongodb, redis, kafka) is managed separately in
# the Infra repo (/opt/apps/infra) and is NOT defined here.
#
# Prerequisites (one-time, on the server):
#   - Networks infra-app-llt and infra-data-llt exist (created by the Infra
#     repo: /opt/apps/infra/scripts/create-networks.sh). LLT never creates them.
#   - global-mongodb running; user created via:
#       /opt/apps/infra/scripts/add-app-mongo-user.sh location_tracker location_tracker_user '<pass>'
#   - global-kafka running (Infra compose):  docker compose up -d kafka
#
# Server deploy path: /opt/apps/live-location-tracker/
#
# Usage:
#   docker compose -f docker-compose.prod.yml build backend
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml ps
#   docker compose -f docker-compose.prod.yml logs -f backend
#
# ═══════════════════════════════════════════════════════════════════════════════

name: llt

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: llt-backend:latest
    container_name: llt-backend
    restart: unless-stopped
    # NO ports exposed to host — global-nginx reaches it via infra-app-llt.
    env_file:
      - .env
    environment:
      # Safe defaults; real values/secrets come from /opt/apps/live-location-tracker/.env.
      # dotenv never overrides existing env vars, so compose wins without code changes.
      - NODE_ENV=production
      - PORT=5000
    networks:
      - infra-app-llt
      - infra-data-llt
    healthcheck:
      # /health returns 200 only when MongoDB is connected, else 503.
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          # Single persistent Node process (see Dockerfile header).
          # CPU ceiling prevents a runaway event loop from consuming all 4 vCPU.
          cpus: "1.0"
          memory: 1G

# ─── External Networks ───────────────────────────────────────────────────────
# Per-app networks created and owned by the Infra repo
# (/opt/apps/infra/scripts/create-networks.sh); LLT never creates or removes them.
#   infra-app-llt   llt-backend + global-nginx + global-prometheus
#                   (ingress incl. Socket.IO, /metrics scraping; has egress,
#                   needed for Google OAuth)
#   infra-data-llt  llt-backend + global-mongodb + global-kafka
#                   (internal: no egress)
# LLT cannot reach other apps, Redis, PostgreSQL or the exporters.
networks:
  infra-app-llt:
    external: true
  infra-data-llt:
    external: true
